name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate latest Still compiler release
        id: still
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/StillAdum/Still/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "still-*-windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "no windows zip asset found in $($rel.tag_name)" }
          "zip=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "tag=$($rel.tag_name)" >> $env:GITHUB_OUTPUT
          Write-Host "Using Still $($rel.tag_name) -> $($asset.browser_download_url)"

      - name: Install Still compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ steps.still.outputs.zip }}" -OutFile still.zip
          Expand-Archive still.zip -DestinationPath stilltool
          Add-Content $env:GITHUB_PATH "$PWD\stilltool"
          & "$PWD\stilltool\still.exe" version

      - name: Install portable C compiler (tcc)
        shell: pwsh
        run: still setup-cc

      - name: Typecheck
        shell: pwsh
        run: still check wingram.strc

      - name: Build wingram.exe
        shell: pwsh
        run: still build wingram.strc -o wingram.exe --release

      - name: Fetch WebView2Loader.dll (webview login support)
        shell: pwsh
        run: |
          $ver = "1.0.2903.40"
          $pkg = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg"
          Invoke-WebRequest -Uri $pkg -OutFile wv2.nupkg
          Expand-Archive wv2.nupkg -DestinationPath wv2
          Copy-Item "wv2\runtimes\win-x64\native\WebView2Loader.dll" .
          Get-Item WebView2Loader.dll | Select-Object Name, Length

      - name: Headless selftest
        shell: pwsh
        run: ./wingram.exe --selftest

      - name: GUI smoke test (opens the login window, renders 90 frames)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\wingram.exe" -ArgumentList "--smoke" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "smoke test timed out"; exit 1 }
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Package release zip (exe + loader)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path wingram.exe, WebView2Loader.dll -DestinationPath "wingram-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wingram-windows-x64
          path: |
            wingram.exe
            WebView2Loader.dll
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wingram.exe
            WebView2Loader.dll
            wingram-${{ github.ref_name }}-windows-x64.zip
          body: |
            Wingram ${{ github.ref_name }} — a real PC Instagram client written in Still.

            **Download the zip** (wingram-exe + WebView2Loader.dll together —
            the login webview needs the loader next to the exe, so keep them
            in the same folder).

            First run: "Log in with Instagram" opens a real Instagram login
            in an embedded Edge window; sign in once (2FA works) and the app
            takes over with your actual feed. No WebView2 on the machine?
            Use the sessionid fallback on the login screen.

            Windows SmartScreen may warn on first launch (unsigned binary);
            choose More info -> Run anyway.
